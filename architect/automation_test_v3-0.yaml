inboundCall:
  name: automation_test
  description: ""
  division: Home
  startUpRef: "/inboundCall/tasks/task[New Task 1_14]"
  defaultLanguage: en-us
  supportedLanguages:
    en-us:
      defaultLanguageSkill:
        noValue: true
      textToSpeech:
        defaultEngine:
          defaultVoice: true
  initialGreeting:
    tts: Hello, this is the initial greeting.
  settingsActionDefaults:
    playAudioOnSilence:
      allowedRepeatCount:
        lit: 5
      silenceDuration:
        lit:
          seconds: 1
      timeout:
        lit:
          seconds: 40
    detectSilence:
      silenceDuration:
        lit:
          seconds: 1
      timeout:
        lit:
          seconds: 40
    callData:
      processingPrompt:
        noValue: true
    collectInput:
      interDigitTimeout:
        lit:
          seconds: 3
      noEntryTimeout:
        lit:
          seconds: 5
    dialByExtension:
      interDigitTimeout:
        lit:
          seconds: 6
    transferToUser:
      connectTimeout:
        noValue: true
    transferToNumber:
      connectTimeout:
        noValue: true
    transferToGroup:
      connectTimeout:
        noValue: true
    transferToFlowSecure:
      connectTimeout:
        lit:
          seconds: 15
  settingsErrorHandling:
    errorHandling:
      disconnect:
        none: true
    preHandlingAudio:
      tts: Sorry, an error occurred. Please try your call again.
  settingsMenu:
    extensionDialingMaxDelay:
      lit:
        seconds: 1
    listenForExtensionDialing:
      lit: true
    menuSelectionTimeout:
      lit:
        seconds: 10
    repeatCount:
      lit: 3
  settingsPrompts:
    ensureAudioInPrompts: false
    promptMediaToValidate:
      - mediaType: audio
      - mediaType: tts
  settingsSpeechRec:
    completeMatchTimeout:
      lit:
        ms: 100
    incompleteMatchTimeout:
      lit:
        ms: 1500
    maxSpeechLengthTimeout:
      lit:
        seconds: 20
    minConfidenceLevel:
      lit: 50
    asrCompanyDir: none
    asrEnabledOnFlow: true
    suppressRecording: true
  tasks:
    - task:
        name: New Task 1
        refId: New Task 1_14
        trackingId: 14
        variables:
          - skillVariable:
              name: Task.skill
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - stringVariable:
              name: Task.skill_input
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
        actions:
          - playAudio:
              name: Play Audio
              trackingId: 15
              audio:
                tts: "Welcome to our Support platform for software engineers. You will be connected to an available agent for your queries. "
          - collectInput:
              name: Collect Input
              trackingId: 19
              inputData:
                var: Task.skill_input
              digits:
                exact: 1
              interDigitTimeout:
                noValue: true
              noEntryTimeout:
                noValue: true
              acceptJustStar:
                lit: false
              acceptJustPound:
                lit: false
              verificationType: none
              outputs:
                success:
                  actions:
                    - switch:
                        name: Switch
                        trackingId: 20
                        evaluate:
                          firstTrue:
                            default:
                              actions:
                                - updateData:
                                    name: Update Data
                                    trackingId: 25
                                    statements:
                                      - skill:
                                          variable: Task.skill
                                          value:
                                            lit:
                                              name: Linux
                            cases:
                              - case:
                                  value:
                                    exp: task.skill_input == "1"
                                  actions:
                                    - updateData:
                                        name: Update Data
                                        trackingId: 21
                                        statements:
                                          - skill:
                                              variable: Task.skill
                                              value:
                                                lit:
                                                  name: Python backend engineer
                              - case:
                                  value:
                                    exp: task.skill_input == "2"
                                  actions:
                                    - updateData:
                                        name: Update Data
                                        trackingId: 22
                                        statements:
                                          - skill:
                                              variable: Task.skill
                                              value:
                                                lit:
                                                  name: Node JS Engineer
                              - case:
                                  value:
                                    exp: task.skill_input == "3"
                                  actions:
                                    - updateData:
                                        name: Update Data
                                        trackingId: 23
                                        statements:
                                          - skill:
                                              variable: Task.skill
                                              value:
                                                lit:
                                                  name: Java Engineer
                              - case:
                                  value:
                                    exp: task.skill_input == "4"
                                  actions:
                                    - updateData:
                                        name: Update Data
                                        trackingId: 24
                                        statements:
                                          - skill:
                                              variable: Task.skill
                                              value:
                                                lit:
                                                  name: GO Engineer
          - transferToAcd:
              name: Transfer to ACD
              trackingId: 17
              targetQueue:
                lit:
                  name: technical support queue
              acdSkills:
                - acdSkill:
                    exp: Task.skill
              priority:
                lit: 0
              preferredAgents:
                noValue: true
              languageSkill:
                noValue: true
              directAgent:
                noValue: true
              failureOutputs:
                errorType:
                  noValue: true
                errorMessage:
                  noValue: true
              skillExpressionFilters:
                noValue: true
          - disconnect:
              name: Disconnect
              trackingId: 18
